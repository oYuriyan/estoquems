name: estoque

services:
  nginx:
    image: ${NGINX_IMAGE:-nginx@sha256:8b1e78743a03dbb2c95171cc58639fef29abc8816598e27fb910ed2e621e589a}
    ports:
      # Expõe a porta 80 e 443 para a rede interna
      - "80:80"
      - "443:443"
    expose:
      - "8080"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html
      - catalog_data:/var/catalog_data
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      api:
        condition: service_healthy
      n8n:
        condition: service_started
    restart: unless-stopped

  db:
    image: ${POSTGRES_IMAGE:-postgres@sha256:df7bca0066e6f60cc3dd32faa70caddec20e2c22b58932f79498e5704b23854a}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER no ambiente privado}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no ambiente privado}
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB no ambiente privado}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estoque_user -d estoque_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - "8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:?Defina DATABASE_URL no ambiente privado}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?Defina JWT_SECRET_KEY no ambiente privado}
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:?Defina a URL HTTPS do piloto}
      - CATALOG_MAX_AGE_HOURS=${CATALOG_MAX_AGE_HOURS:-48}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - PASSWORD_RESET_URL=${PASSWORD_RESET_URL:?Defina a URL publica de recuperacao}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    
  init-perms:
    image: alpine
    volumes:
      - catalog_data:/data
      - n8n_data:/home/node/.n8n
    command: sh -c "chown -R 1000:1000 /data && chown -R 1000:1000 /home/node/.n8n"

  n8n:
    image: ${N8N_IMAGE:-n8nio/n8n@sha256:ddb5204bc8c7b71c446dfe1c1dce296df138bcfadb7f5e27d7de35ec2889d026}
    depends_on:
      init-perms:
        condition: service_completed_successfully
    # EM PRODUÇÃO: Usamos `ports` apontando exclusivamente para 127.0.0.1.
    # Isso impede acesso externo pela rede, mas permite que o Túnel SSH funcione.
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - N8N_USER_FOLDER=/home/node/
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=false
      - N8N_RESTRICT_FILE_ACCESS_TO=/data
    volumes:
      - n8n_data:/home/node/.n8n
      - catalog_data:/data
    restart: unless-stopped

volumes:
  n8n_data:
  postgres_data:
  catalog_data:
