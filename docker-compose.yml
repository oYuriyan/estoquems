services:
  nginx:
    image: nginx:alpine
    ports:
      - "3030:80"
      - "3443:443"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html
      - catalog_data:/var/catalog_data
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      api:
        condition: service_healthy
      n8n:
        condition: service_started
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estoque_user -d estoque_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - "8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
  init-perms:
    image: alpine
    volumes:
      - catalog_data:/data
      - n8n_data:/home/node/.n8n
    command: sh -c "chown -R 1000:1000 /data && chown -R 1000:1000 /home/node/.n8n"

  n8n:
    image: n8nio/n8n:latest
    depends_on:
      init-perms:
        condition: service_completed_successfully
    # QW-7: removed user:root — runs as default n8n user (uid 1000) for security
    # QW-4: using expose instead of ports — n8n admin UI is NOT accessible externally,
    #        only reachable internally via nginx proxy at /webhook/
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://nginx/
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - N8N_USER_FOLDER=/home/node/
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=false
      - N8N_RESTRICT_FILE_ACCESS_TO=/data
    volumes:
      - n8n_data:/home/node/.n8n
      - catalog_data:/data
    restart: unless-stopped

volumes:
  n8n_data:
  postgres_data:
  catalog_data:
