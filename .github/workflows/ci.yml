name: CI — Lint, Test & Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Cancela runs anteriores do mesmo PR para economizar minutos do GitHub Actions
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1: Backend — lint + testes
  # ─────────────────────────────────────────────────────────────────────────────
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: isolated-ci-password
          POSTGRES_DB: lummium_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: pip-

      - name: Instalar dependências
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar imports e sintaxe (pyflakes)
        working-directory: backend
        run: |
          pip install pyflakes
          python -m pyflakes app/

      - name: Rodar testes unitários
        working-directory: backend
        env:
          DATABASE_URL: "postgresql+asyncpg://postgres:isolated-ci-password@localhost:5432/lummium_test"
          TEST_DATABASE_URL: "postgresql+asyncpg://postgres:isolated-ci-password@localhost:5432/lummium_test"
          JWT_SECRET_KEY: "chave-secreta-de-teste-ci-nao-usar-em-producao"
          FRONTEND_ORIGIN: "http://localhost:3030"
          APP_ENV: "test"
          SENTRY_DSN: ""   # Desativado no CI
        run: |
          python -m pytest tests -v --tb=short

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: Frontend — lint + build
  # ─────────────────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (Node.js / React)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Lint (ESLint)
        working-directory: frontend
        run: npm run lint

      - name: Testes de disponibilidade e propostas
        working-directory: frontend
        run: npm test

      - name: Build de produção
        working-directory: frontend
        env:
          VITE_SENTRY_DSN: ""       # Build funciona sem DSN no CI
          VITE_APP_VERSION: ${{ github.sha }}
        run: npm run build

      - name: Verificar tamanho do bundle
        working-directory: frontend
        run: |
          echo "=== Tamanho do bundle ==="
          du -sh dist/
          find dist/assets -name "*.js" | head -5 | xargs -I{} sh -c 'echo "{}: $(du -sh {} | cut -f1)"'

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 3: Docker build (valida o Dockerfile)
  # ─────────────────────────────────────────────────────────────────────────────
  docker:
    name: Docker Build (Backend)
    runs-on: ubuntu-latest
    needs: [backend]   # Só roda se o backend passar

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build imagem Docker
        run: |
          docker build ./backend -t estoque-api:ci-test --no-cache

      - name: Verificar que a imagem sobe sem erro de import
        run: |
          docker run --rm \
            -e DATABASE_URL="sqlite+aiosqlite:///:memory:" \
            -e JWT_SECRET_KEY="chave-ci-apenas" \
            -e FRONTEND_ORIGIN="http://localhost" \
            estoque-api:ci-test \
            python -c "from app.main import app; print('✅ Import OK')"
