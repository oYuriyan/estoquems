# Limit zones — definidos fora do bloco server para escopo http
# Esses limites protegem contra força bruta e scraping de API

# Zona para endpoints de autenticação (mais restrita: 5 req/min por IP)
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

# Zona para API geral (120 req/min por IP — mesmo limite do slowapi no Python)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=120r/m;

server {
    listen 80;
    server_name _;

    # Permite que o backend (API) e outros containers leiam o catálogo internamente via HTTP
    location = /catalogo.json {
        alias /var/catalog_data/catalogo.json;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires off;
    }

    # Redireciona todo o resto do tráfego HTTP para HTTPS (usando a porta externa 3443)
    location / {
        return 301 https://$host:3443$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name _;

    # Certificados SSL montados via volume
    ssl_certificate /etc/nginx/ssl/selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/selfsigned.key;
    
    # Boas práticas SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    # ── Security Headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header X-DNS-Prefetch-Control "off" always;
    # CSP: permite fontes do Google (Inter) e o próprio sentry via connect-src
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; connect-src 'self' https://*.sentry.io; font-src 'self' https://fonts.gstatic.com; worker-src 'self'; frame-ancestors 'none';" always;

    # Oculta a versão do nginx nos headers e páginas de erro
    server_tokens off;

    # ── Gzip Compression ─────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/x-javascript
        application/xml
        application/json
        application/javascript
        application/wasm
        image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # ── Static Asset Caching (hashed filenames — immutable) ──────────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ── Catalog JSON — never cache (always fresh) ─────────────────────────────
    location = /catalogo.json {
        alias /var/catalog_data/catalogo.json;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires off;
    }

    # ── SPA fallback (React Router) ───────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;

        # index.html não deve ser cacheado pelos browsers
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            expires 0;
        }
    }

    # ── Auth endpoints — rate limit restrito (anti força-bruta) ──────────────
    location /api/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://api:8000/api/auth/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }

    # ── API Backend Proxy ─────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;
        limit_req_status 429;

        proxy_pass http://api:8000/api/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;

        # WebSocket support (para /api/ws)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;  # 1h de timeout para WebSockets
    }

    # ── N8N Webhook Proxy (internal only — n8n port not exposed publicly) ────
    location /webhook/ {
        proxy_pass http://n8n:5678/webhook/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }

    # ── Bloqueia acesso direto a arquivos sensíveis ───────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
